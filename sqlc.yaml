version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - column: identities.traits
            go_type:
              type: Traits
          - column: identity_credentials.config
            go_type: encoding/json.RawMessage
          - column: identity_credentials.type
            go_type:
              type: CredentialType
          - column: identity_credential_identifiers.type
            go_type:
              type: CredentialType
