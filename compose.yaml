services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: noosphere
      POSTGRES_PASSWORD: noosphere
      POSTGRES_DB: noosphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noosphere -d noosphere"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
