{{define "content"}}
<h1>Create an account</h1>
<form method="post" action="{{.Action}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{.Email}}" autocomplete="email" required
    {{- with .Errors.Email}} aria-invalid="true" aria-describedby="email-error"{{end}}>
  {{- with .Errors.Email}}
  <small id="email-error">{{.}}</small>
  {{- end}}

  <label for="first_name">First name (optional)</label>
  <input id="first_name" name="first_name" type="text" value="{{.FirstName}}" autocomplete="given-name">

  <label for="last_name">Last name (optional)</label>
  <input id="last_name" name="last_name" type="text" value="{{.LastName}}" autocomplete="family-name">

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required
    aria-describedby="{{if .Errors.Password}}password-error{{else}}password-hint{{end}}"
    {{- with .Errors.Password}} aria-invalid="true"{{end}}>
  {{- with .Errors.Password}}
  <small id="password-error">{{.}}</small>
  {{- else}}
  <small id="password-hint">{{.PasswordHint}}</small>
  {{- end}}

  <button type="submit">Sign up</button>
</form>
{{end}}
