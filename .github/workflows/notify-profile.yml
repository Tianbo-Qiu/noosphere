# Refreshes the code activity widget on github.com/Tianbo-Qiu right after a push.
name: notify profile

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profile code stats
        env:
          TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Tianbo-Qiu/Tianbo-Qiu/dispatches \
            -d '{"event_type":"code-push"}'
