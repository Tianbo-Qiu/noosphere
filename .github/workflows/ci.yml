name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: noosphere
          POSTGRES_PASSWORD: noosphere
          POSTGRES_DB: noosphere_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U noosphere -d noosphere_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - run: make fmt-check vet
      - run: make test-v ARGS=-github-output
